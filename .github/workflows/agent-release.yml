name: Agent Binary Release

on:
  push:
    tags:
      - 'agent-v*'

jobs:
  build:
    if: github.repository == 'jarod-rosenthal/workermill'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          cd agent && npm ci
          cd ../worker && npm ci --ignore-scripts

      - name: Compile worker dependencies
        run: cd worker/epic && npx tsc || true

      - name: Build bundles
        run: cd agent && npm run build

      - name: Compile binaries
        run: |
          cd agent
          mkdir -p dist/bin
          bun build --compile --target=bun-linux-x64 dist/entry.js --outfile dist/bin/workermill-agent-linux-x64
          bun build --compile --target=bun-darwin-x64 dist/entry.js --outfile dist/bin/workermill-agent-darwin-x64
          bun build --compile --target=bun-darwin-arm64 dist/entry.js --outfile dist/bin/workermill-agent-darwin-arm64
          bun build --compile --target=bun-windows-x64 dist/entry.js --outfile dist/bin/workermill-agent-win-x64.exe
          ls -lh dist/bin/

      - name: Write version manifest
        run: |
          VERSION="${GITHUB_REF_NAME#agent-v}"
          echo "{\"version\":\"${VERSION}\",\"tag\":\"${GITHUB_REF_NAME}\"}" > agent/dist/bin/latest.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload to S3 CDN
        run: |
          aws s3 cp agent/dist/bin/workermill-agent-linux-x64 s3://${{ vars.FRONTEND_S3_BUCKET }}/agent/latest/workermill-agent-linux-x64 --content-type application/octet-stream
          aws s3 cp agent/dist/bin/workermill-agent-darwin-x64 s3://${{ vars.FRONTEND_S3_BUCKET }}/agent/latest/workermill-agent-darwin-x64 --content-type application/octet-stream
          aws s3 cp agent/dist/bin/workermill-agent-darwin-arm64 s3://${{ vars.FRONTEND_S3_BUCKET }}/agent/latest/workermill-agent-darwin-arm64 --content-type application/octet-stream
          aws s3 cp agent/dist/bin/workermill-agent-win-x64.exe s3://${{ vars.FRONTEND_S3_BUCKET }}/agent/latest/workermill-agent-win-x64.exe --content-type application/octet-stream
          aws s3 cp agent/dist/bin/latest.json s3://${{ vars.FRONTEND_S3_BUCKET }}/agent/latest.json --content-type application/json
          aws s3 cp agent/install.sh s3://${{ vars.FRONTEND_S3_BUCKET }}/install.sh --content-type text/plain
          aws s3 cp agent/install.ps1 s3://${{ vars.FRONTEND_S3_BUCKET }}/install.ps1 --content-type text/plain

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/agent/*" "/install.sh" "/install.ps1"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent/dist/bin/workermill-agent-linux-x64
            agent/dist/bin/workermill-agent-darwin-x64
            agent/dist/bin/workermill-agent-darwin-arm64
            agent/dist/bin/workermill-agent-win-x64.exe
            agent/install.sh
            agent/install.ps1
          generate_release_notes: true

  docker:
    if: github.repository == 'jarod-rosenthal/workermill'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#agent-v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker sandbox image
        uses: docker/build-push-action@v7
        with:
          context: ./worker
          file: worker/Dockerfile
          push: true
          tags: |
            ghcr.io/jarod-rosenthal/worker:${{ steps.version.outputs.version }}
            ghcr.io/jarod-rosenthal/worker:latest

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/jarod-rosenthal/api:${{ steps.version.outputs.version }}
            ghcr.io/jarod-rosenthal/api:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/jarod-rosenthal/frontend:${{ steps.version.outputs.version }}
            ghcr.io/jarod-rosenthal/frontend:latest

      - name: Make GHCR packages public
        run: |
          for pkg in worker api frontend; do
            curl -s -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/jarod-rosenthal/packages/container/${pkg}" \
              -d '{"visibility":"public"}' || echo "Warning: could not set ${pkg} package visibility"
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update ECS task definitions
        if: success()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ECS_CLUSTER="${{ secrets.WM_PROD_ECS_CLUSTER }}"

          # Helper: resolve GHCR digest via buildx (image is NOT local — BuildKit pushed directly)
          resolve_digest() {
            docker buildx imagetools inspect "$1:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"'
          }

          # Helper: update an ECS task definition's first container image
          update_task_def() {
            local FAMILY="$1" IMAGE="$2"
            TASK_DEF=$(aws ecs describe-task-definition \
              --task-definition "$FAMILY" --region us-east-1 \
              --query 'taskDefinition' --output json)
            NEW_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "$IMAGE" '
              del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) |
              .containerDefinitions[0].image = $IMAGE')
            echo "$NEW_DEF" > /tmp/task-def.json
            ARN=$(aws ecs register-task-definition \
              --cli-input-json file:///tmp/task-def.json --region us-east-1 \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            echo "$ARN"
          }

          # --- Worker ---
          WORKER_DIGEST=$(resolve_digest "ghcr.io/jarod-rosenthal/worker")
          WORKER_IMAGE="ghcr.io/jarod-rosenthal/worker@${WORKER_DIGEST}"
          echo "Worker image: ${WORKER_IMAGE}"
          WORKER_ARN=$(update_task_def "${ECS_CLUSTER}-worker" "$WORKER_IMAGE")
          echo "Worker task definition: ${WORKER_ARN}"

          # --- API ---
          API_DIGEST=$(resolve_digest "ghcr.io/jarod-rosenthal/api")
          API_IMAGE="ghcr.io/jarod-rosenthal/api@${API_DIGEST}"
          echo "API image: ${API_IMAGE}"
          API_ARN=$(update_task_def "${ECS_CLUSTER}-api" "$API_IMAGE")
          echo "API task definition: ${API_ARN}"

          # Update API service
          aws ecs update-service --cluster "${ECS_CLUSTER}" \
            --service "${ECS_CLUSTER}-api" --task-definition "$API_ARN" \
            --region us-east-1 --output text > /dev/null
          echo "API service updated"

          # --- Orchestrator (same image as API) ---
          ORCH_ARN=$(update_task_def "${ECS_CLUSTER}-orchestrator" "$API_IMAGE")
          echo "Orchestrator task definition: ${ORCH_ARN}"

          aws ecs update-service --cluster "${ECS_CLUSTER}" \
            --service "${ECS_CLUSTER}-orchestrator" --task-definition "$ORCH_ARN" \
            --region us-east-1 --output text > /dev/null
          echo "Orchestrator service updated"
