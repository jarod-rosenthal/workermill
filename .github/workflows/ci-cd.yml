name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.12.0', '22.22.2']
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep apparmor
          # Load Ubuntu's packaged, purpose-built bwrap policy so the runtime
          # can create its user namespace without changing global restrictions.
          if [ -f /etc/apparmor.d/bwrap ]; then
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / -- /bin/true

      - name: Install macOS sandbox dependency
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit Tests
        env:
          WM_REQUIRE_OS_SANDBOX: "1"
        run: npm test

      - name: Installed package and OS runtime tests
        run: npm run test:package-os
