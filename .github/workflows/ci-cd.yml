name: CI/CD Pipeline

on:
  # Manual trigger only - gradually enable automatic triggers as testing proves stable
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy API to ECS'
        required: false
        type: boolean
        default: false
      deploy_frontend:
        description: 'Deploy Frontend to S3/CloudFront'
        required: false
        type: boolean
        default: false
      deploy_worker:
        description: 'Deploy Worker image to ECR'
        required: false
        type: boolean
        default: false
      run_ci_only:
        description: 'Run CI checks only (no deploy)'
        required: false
        type: boolean
        default: true
      run_e2e:
        description: 'Run E2E tests on self-hosted runner'
        required: false
        type: boolean
        default: false
      run_integration:
        description: 'Run integration tests on self-hosted runner'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_API_REPO: workermill-dev/api
  ECR_WORKER_REPO: workermill-dev/worker
  ECS_CLUSTER: workermill-dev
  ECS_SERVICE: workermill-dev-api
  S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  # ============================================================================
  # CI JOBS - Run type checks and lint
  # ============================================================================

  api-ci:
    name: API - Type Check, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Type Check
        working-directory: api
        run: npm run typecheck

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Build
        working-directory: api
        run: npm run build

      - name: Unit Tests
        working-directory: api
        run: npm run test

  frontend-ci:
    name: Frontend - Type Check, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true  # Pre-existing React hook and any-type issues need refactoring

      - name: Build
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # E2E TESTS - Run on self-hosted runner in VPC for database access
  # Triggered manually via workflow_dispatch only
  # ============================================================================

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: [self-hosted, linux, x64, ecs]
    needs: [api-ci, frontend-ci]
    # Manual trigger only
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e == true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test
        env:
          BASE_URL: https://workermill.com
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: frontend/e2e/test-results/
          retention-days: 7

  # ============================================================================
  # INTEGRATION TESTS - Run on self-hosted runner in VPC for database access
  # Triggered manually via workflow_dispatch only
  # ============================================================================

  integration-tests:
    name: API Integration Tests
    runs-on: [self-hosted, linux, x64, ecs]
    needs: [api-ci]
    # Manual trigger only
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration == true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Run integration tests
        working-directory: api
        run: npm run test:integration
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          NODE_ENV: test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: api/coverage/
          retention-days: 7

  # ============================================================================
  # DEPLOYMENT JOBS - Manual trigger only via workflow_dispatch inputs
  # Each deploy job builds independently (no artifact passing)
  # ============================================================================

  deploy-api:
    name: Deploy API to ECS
    # Depend on tests if they ran, otherwise just CI
    needs: [api-ci, integration-tests]
    runs-on: ubuntu-latest
    # Only deploy if explicitly requested and tests passed (or were skipped)
    if: |
      always() &&
      inputs.deploy_api == true &&
      needs.api-ci.result == 'success' &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped')
    environment:
      name: production
      url: https://api.workermill.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push API image to ECR
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd api
          docker build -t $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_API_REPO:latest .
          docker push $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_API_REPO:latest
          echo "image=$ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' $ECR_REGISTRY/$ECR_API_REPO:$IMAGE_TAG)" >> $GITHUB_OUTPUT

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
        timeout-minutes: 10

      - name: Verify API health
        run: |
          echo "API deployment successful. Service is stable."
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{status:status, runningCount:runningCount, desiredCount:desiredCount, deployments:deployments[0]}' \
            --output table \
            --region ${{ env.AWS_REGION }}

  deploy-frontend:
    name: Deploy Frontend to S3/CloudFront
    # Depend on E2E tests if they ran, otherwise just CI
    needs: [frontend-ci, e2e-tests]
    runs-on: ubuntu-latest
    # Only deploy if explicitly requested and tests passed (or were skipped)
    if: |
      always() &&
      inputs.deploy_frontend == true &&
      needs.frontend-ci.result == 'success' &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped')
    environment:
      name: production
      url: https://workermill.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --region ${{ env.AWS_REGION }} \
            --cache-control "public, max-age=3600" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Sync static assets to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --region ${{ env.AWS_REGION }} \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"

      - name: Invalidate CloudFront cache
        id: invalidation
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation_id=$INVALIDATION_ID" >> $GITHUB_OUTPUT

      - name: Wait for CloudFront invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION }} \
            --id ${{ steps.invalidation.outputs.invalidation_id }}
        timeout-minutes: 15

      - name: Verify frontend deployment
        run: |
          echo "Frontend deployment successful."
          echo "URL: https://workermill.com"
          echo "Distribution: ${{ env.CLOUDFRONT_DISTRIBUTION }}"

  deploy-worker:
    name: Deploy Worker Image to ECR
    runs-on: ubuntu-latest
    if: inputs.deploy_worker == true
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push worker image to ECR
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd worker
          docker build -t $ECR_REGISTRY/$ECR_WORKER_REPO:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_WORKER_REPO:latest .
          docker push $ECR_REGISTRY/$ECR_WORKER_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_WORKER_REPO:latest
          echo "image=$ECR_REGISTRY/$ECR_WORKER_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Verify worker image deployment
        run: |
          echo "Worker image deployed to ECR."
          echo "Image: ${{ steps.image.outputs.image }}"
          echo "New worker tasks will use the updated image."

  # ============================================================================
  # STATUS CHECK - Summary of deployment
  # ============================================================================

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    if: always() && (inputs.deploy_api == true || inputs.deploy_frontend == true || inputs.deploy_worker == true)
    needs:
      - api-ci
      - frontend-ci
      - e2e-tests
      - integration-tests
      - deploy-api
      - deploy-frontend
      - deploy-worker
    steps:
      - name: Deployment complete
        run: |
          echo "Deployment Summary:"
          echo "==================="
          echo ""
          echo "CI Results:"
          echo "  API CI: ${{ needs.api-ci.result }}"
          echo "  Frontend CI: ${{ needs.frontend-ci.result }}"
          echo ""
          echo "Test Results:"
          echo "  E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "  Integration Tests: ${{ needs.integration-tests.result }}"
          echo ""
          echo "Deployments:"
          if [ "${{ inputs.deploy_api }}" == "true" ]; then
            echo "  API: ${{ needs.deploy-api.result }} - https://workermill.com/api"
          else
            echo "  API: Skipped"
          fi
          if [ "${{ inputs.deploy_frontend }}" == "true" ]; then
            echo "  Frontend: ${{ needs.deploy-frontend.result }} - https://workermill.com"
          else
            echo "  Frontend: Skipped"
          fi
          if [ "${{ inputs.deploy_worker }}" == "true" ]; then
            echo "  Worker: ${{ needs.deploy-worker.result }} - Image updated in ECR"
          else
            echo "  Worker: Skipped"
          fi
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
