name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy API to ECS'
        required: false
        type: boolean
        default: false
      deploy_frontend:
        description: 'Deploy Frontend to S3/CloudFront'
        required: false
        type: boolean
        default: false
      deploy_worker:
        description: 'Deploy Worker image to ECR'
        required: false
        type: boolean
        default: false
      run_ci_only:
        description: 'Run CI checks only (no deploy)'
        required: false
        type: boolean
        default: true
      run_e2e:
        description: 'Run E2E tests on self-hosted runner'
        required: false
        type: boolean
        default: false
      # run_integration: disabled — requires self-hosted ECS runner
      # Run locally: ./bin/bastion start && cd api && npm run test:integration

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  # ============================================================================
  # CI JOBS - Run type checks and lint
  # ============================================================================

  api-ci:
    name: API - Type Check, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Type Check
        working-directory: api
        run: npm run typecheck

      - name: Lint
        working-directory: api
        run: npm run lint

      - name: Build
        working-directory: api
        run: npm run build

      - name: Unit Tests
        working-directory: api
        run: npm run test

  frontend-ci:
    name: Frontend - Type Check, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  agent-ci:
    name: Agent - Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent/package-lock.json

      - name: Install agent dependencies
        working-directory: agent
        run: npm ci

      - name: Install API dependencies (agent imports ../api/src/)
        working-directory: api
        run: npm ci

      - name: Type Check
        working-directory: agent
        run: npm run typecheck

  cli-ci:
    name: CLI - Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci --legacy-peer-deps

      - name: Install engine dependencies
        working-directory: packages/engine
        run: npm install

      - name: Unit Tests
        working-directory: cli
        run: npx vitest run

  engine-ci:
    name: Engine - Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: packages/engine
        run: npm install

      - name: Unit Tests
        working-directory: packages/engine
        run: npx vitest run

  # ============================================================================
  # E2E TESTS - Playwright against production
  # Triggered manually via workflow_dispatch only
  # ============================================================================

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [api-ci, frontend-ci]
    # Manual trigger only
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e == true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test --reporter=list,html,junit
        env:
          BASE_URL: https://workermill.com
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_API_KEY: ${{ secrets.E2E_API_KEY }}
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results.xml

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-test-results
          path: frontend/e2e/test-results/
          retention-days: 7

      - name: Upload JUnit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-results
          path: frontend/results.xml
          retention-days: 7

  # ============================================================================
  # INTEGRATION TESTS - Disabled: requires self-hosted ECS runner in VPC
  # Run locally instead: ./bin/bastion start && cd api && npm run test:integration
  # Uncomment when a self-hosted runner is set up in the VPC.
  # ============================================================================

  # integration-tests:
  #   name: API Integration Tests
  #   runs-on: [self-hosted, linux, x64, ecs]
  #   needs: [api-ci]
  #   if: github.event_name == 'workflow_dispatch' && inputs.run_integration == true
  #   steps:
  #     - uses: actions/checkout@v6
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v6
  #       with:
  #         node-version: '20'
  #
  #     - name: Install API dependencies
  #       working-directory: api
  #       run: npm ci
  #
  #     - name: Run integration tests
  #       working-directory: api
  #       run: npm run test:integration
  #       env:
  #         DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
  #         NODE_ENV: test
  #
  #     - name: Upload test results
  #       uses: actions/upload-artifact@v7
  #       if: always()
  #       with:
  #         name: integration-test-results
  #         path: api/coverage/
  #         retention-days: 7

  # ============================================================================
  # DEPLOYMENT JOBS - Manual trigger only via workflow_dispatch inputs
  # Each deploy job builds independently (no artifact passing)
  # ============================================================================

  deploy-api:
    name: Update API from GHCR
    needs: [api-ci]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_api == true &&
      needs.api-ci.result == 'success'
    environment:
      name: production
      url: https://api.workermill.com
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS API + orchestrator to latest GHCR image
        run: |
          GHCR_IMAGE="ghcr.io/jarod-rosenthal/api"

          docker pull "${GHCR_IMAGE}:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${GHCR_IMAGE}:latest" | grep -o 'sha256:[a-f0-9]*')
          NEW_IMAGE="${GHCR_IMAGE}@${DIGEST}"
          echo "Updating ECS to: ${NEW_IMAGE}"

          # Update API task definition + service
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${{ env.ECS_CLUSTER }}-api" --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "$NEW_IMAGE" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) |
            .containerDefinitions[0].image = $IMAGE')
          echo "$NEW_TASK_DEF" > /tmp/api-task-def.json
          API_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/api-task-def.json --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} --task-definition "$API_ARN" \
            --region ${{ env.AWS_REGION }} --output text > /dev/null

          # Update orchestrator task definition + service (same image)
          ORCH_DEF=$(aws ecs describe-task-definition \
            --task-definition "${{ env.ECS_CLUSTER }}-orchestrator" --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' --output json)
          NEW_ORCH_DEF=$(echo "$ORCH_DEF" | jq --arg IMAGE "$NEW_IMAGE" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) |
            .containerDefinitions[0].image = $IMAGE')
          echo "$NEW_ORCH_DEF" > /tmp/orch-task-def.json
          ORCH_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/orch-task-def.json --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} \
            --service "${{ env.ECS_CLUSTER }}-orchestrator" --task-definition "$ORCH_ARN" \
            --region ${{ env.AWS_REGION }} --output text > /dev/null

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}
        timeout-minutes: 10

      - name: Verify API health
        run: |
          echo "API deployment successful. Service is stable."
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{status:status, runningCount:runningCount, desiredCount:desiredCount}' \
            --output table \
            --region ${{ env.AWS_REGION }}

  deploy-frontend:
    name: Deploy Frontend to S3/CloudFront
    # Depend on E2E tests if they ran, otherwise just CI
    needs: [frontend-ci, e2e-tests]
    runs-on: ubuntu-latest
    # Only deploy if explicitly requested and tests passed (or were skipped)
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_frontend == true &&
      needs.frontend-ci.result == 'success' &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped')
    environment:
      name: production
      url: https://workermill.com
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --region ${{ env.AWS_REGION }} \
            --cache-control "public, max-age=3600" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Sync static assets to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --region ${{ env.AWS_REGION }} \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"

      - name: Invalidate CloudFront cache
        id: invalidation
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation_id=$INVALIDATION_ID" >> $GITHUB_OUTPUT

      - name: Wait for CloudFront invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION }} \
            --id ${{ steps.invalidation.outputs.invalidation_id }}
        timeout-minutes: 15

      - name: Verify frontend deployment
        run: |
          echo "Frontend deployment successful."
          echo "URL: https://workermill.com"
          echo "Distribution: ${{ env.CLOUDFRONT_DISTRIBUTION }}"

  deploy-worker:
    name: Update Worker Image from GHCR
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_worker == true
    environment:
      name: production
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task definition to latest GHCR image
        run: |
          GHCR_IMAGE="ghcr.io/jarod-rosenthal/worker"

          docker pull "${GHCR_IMAGE}:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${GHCR_IMAGE}:latest" | grep -o 'sha256:[a-f0-9]*')
          NEW_IMAGE="${GHCR_IMAGE}@${DIGEST}"
          echo "Updating ECS task definition to: ${NEW_IMAGE}"

          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${ECS_CLUSTER}-worker" \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' \
            --output json)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "$NEW_IMAGE" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) |
            .containerDefinitions[0].image = $IMAGE
          ')

          echo "$NEW_TASK_DEF" > /tmp/task-def.json
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def.json \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Worker task definition updated: ${NEW_ARN}"

      - name: Verify worker image deployment
        run: |
          echo "Worker image updated from GHCR."
          echo "New worker tasks will use the updated image."

  # ============================================================================
  # STATUS CHECK - Summary of deployment
  # ============================================================================

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'workflow_dispatch' && (inputs.deploy_api == true || inputs.deploy_frontend == true || inputs.deploy_worker == true)
    needs:
      - api-ci
      - frontend-ci
      - agent-ci
      - e2e-tests
      - deploy-api
      - deploy-frontend
      - deploy-worker
    steps:
      - name: Deployment complete
        run: |
          echo "Deployment Summary:"
          echo "==================="
          echo ""
          echo "CI Results:"
          echo "  API CI: ${{ needs.api-ci.result }}"
          echo "  Frontend CI: ${{ needs.frontend-ci.result }}"
          echo "  Agent CI: ${{ needs.agent-ci.result }}"
          echo ""
          echo "Test Results:"
          echo "  E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "  Integration Tests: local only (./bin/bastion start)"
          echo ""
          echo "Deployments:"
          if [ "${{ inputs.deploy_api }}" == "true" ]; then
            echo "  API: ${{ needs.deploy-api.result }} - Image updated from GHCR - https://workermill.com/api"
          else
            echo "  API: Skipped"
          fi
          if [ "${{ inputs.deploy_frontend }}" == "true" ]; then
            echo "  Frontend: ${{ needs.deploy-frontend.result }} - https://workermill.com"
          else
            echo "  Frontend: Skipped"
          fi
          if [ "${{ inputs.deploy_worker }}" == "true" ]; then
            echo "  Worker: ${{ needs.deploy-worker.result }} - Image updated from GHCR"
          else
            echo "  Worker: Skipped"
          fi
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
