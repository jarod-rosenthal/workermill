name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-ci:
    name: CLI - Type Check, Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Type Check
        working-directory: cli
        run: npm run typecheck

      - name: Lint
        working-directory: cli
        run: npm run lint

      - name: Build
        working-directory: cli
        run: npm run build

      - name: Unit Tests
        working-directory: cli
        run: npx vitest run
