name: Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
  workflow_dispatch:

jobs:
  build-and-push:
    if: github.repository == 'jarod-rosenthal/workermill'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: ./api
            dockerfile: api/Dockerfile
            image: ghcr.io/jarod-rosenthal/api
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: sha
        run: echo "short=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ steps.sha.outputs.short }}

  update-ecs:
    name: Update ECS API task definitions
    needs: build-and-push
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update API and orchestrator ECS task definitions
        env:
          ECS_CLUSTER: ${{ secrets.WM_PROD_ECS_CLUSTER }}
        run: |
          GHCR_IMAGE="ghcr.io/jarod-rosenthal/api"
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)

          docker pull "${GHCR_IMAGE}:${SHORT_SHA}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${GHCR_IMAGE}:${SHORT_SHA}" | grep -o 'sha256:[a-f0-9]*')
          if [[ -z "$DIGEST" ]]; then
            echo "::error::Failed to resolve digest for ${GHCR_IMAGE}:${SHORT_SHA}"
            exit 1
          fi
          NEW_IMAGE="${GHCR_IMAGE}@${DIGEST}"
          echo "Updating ECS to: ${NEW_IMAGE}"

          # Update API task definition + service
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${ECS_CLUSTER}-api" --region us-east-1 \
            --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "$NEW_IMAGE" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) |
            .containerDefinitions[0].image = $IMAGE')
          echo "$NEW_TASK_DEF" > /tmp/api-task-def.json
          API_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/api-task-def.json --region us-east-1 \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "API task definition: ${API_ARN}"

          aws ecs update-service --cluster "${ECS_CLUSTER}" \
            --service "${ECS_CLUSTER}-api" --task-definition "$API_ARN" \
            --region us-east-1 --output text > /dev/null

          # Update orchestrator task definition + service (same image)
          ORCH_DEF=$(aws ecs describe-task-definition \
            --task-definition "${ECS_CLUSTER}-orchestrator" --region us-east-1 \
            --query 'taskDefinition' --output json)
          NEW_ORCH_DEF=$(echo "$ORCH_DEF" | jq --arg IMAGE "$NEW_IMAGE" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) |
            .containerDefinitions[0].image = $IMAGE')
          echo "$NEW_ORCH_DEF" > /tmp/orch-task-def.json
          ORCH_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/orch-task-def.json --region us-east-1 \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Orchestrator task definition: ${ORCH_ARN}"

          aws ecs update-service --cluster "${ECS_CLUSTER}" \
            --service "${ECS_CLUSTER}-orchestrator" --task-definition "$ORCH_ARN" \
            --region us-east-1 --output text > /dev/null

          echo "ECS API + orchestrator updated to ${NEW_IMAGE}"
