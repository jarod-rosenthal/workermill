name: Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-and-push:
    if: github.repository == 'jarod-rosenthal/workermill'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: ./api
            dockerfile: api/Dockerfile
            image: ghcr.io/jarod-rosenthal/api
          - name: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            image: ghcr.io/jarod-rosenthal/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: sha
        run: echo "short=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ steps.sha.outputs.short }}
