name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        type: choice
        options:
          - local
          - production
        default: production

jobs:
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
      CI: true

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      # Local: start full stack with local auto-login + mock workers
      - name: Install API dependencies
        if: inputs.target == 'local'
        working-directory: api
        run: npm ci

      - name: Start local WorkerMill
        if: inputs.target == 'local'
        run: |
          chmod +x bin/local-workermill
          ./bin/local-workermill start --mock-workers --skip-fe
          # API runs on :3001 with EXECUTION_MODE=local (auto-login)
          # Playwright starts frontend on :5173 via webServer config

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test
        env:
          BASE_URL: ${{ inputs.target == 'production' && 'https://workermill.com' || '' }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ inputs.target }}
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload failure screenshots & traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.target }}
          path: frontend/e2e/test-results/
          retention-days: 7

      # Local: tear down
      - name: Stop local WorkerMill
        if: always() && inputs.target == 'local'
        run: ./bin/local-workermill stop || true
