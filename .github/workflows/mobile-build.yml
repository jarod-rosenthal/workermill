name: Mobile Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build for'
        required: true
        type: choice
        options:
          - android
          - ios
          - all
        default: android
      profile:
        description: 'Build profile'
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Type Check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Lint
        working-directory: mobile
        run: npx eslint . --ext .ts,.tsx

      - name: Unit Tests
        working-directory: mobile
        run: npm test -- --ci --passWithNoTests --coverage

      - name: Placeholder Guard
        working-directory: mobile
        run: |
          if grep -r "REPLACE_WITH_CLIENT_ID" --include="*.ts" --include="*.tsx" --include="*.json" .; then
            echo "ERROR: Found placeholder values in source files"
            exit 1
          fi

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android ${{ inputs.profile }}
        working-directory: mobile
        run: eas build --profile ${{ inputs.profile }} --platform android --non-interactive

  build-ios:
    name: Build iOS
    runs-on: ubuntu-latest
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Type Check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Lint
        working-directory: mobile
        run: npx eslint . --ext .ts,.tsx

      - name: Unit Tests
        working-directory: mobile
        run: npm test -- --ci --passWithNoTests --coverage

      - name: Placeholder Guard
        working-directory: mobile
        run: |
          if grep -r "REPLACE_WITH_CLIENT_ID" --include="*.ts" --include="*.tsx" --include="*.json" .; then
            echo "ERROR: Found placeholder values in source files"
            exit 1
          fi

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS ${{ inputs.profile }}
        working-directory: mobile
        run: eas build --profile ${{ inputs.profile }} --platform ios --non-interactive