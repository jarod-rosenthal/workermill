name: Model Monitor

on:
  schedule:
    # Run daily at 8am UTC (4am ET)
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (detect only, no PR)"
        type: boolean
        default: false

jobs:
  check-models:
    if: github.repository == 'jarod-rosenthal/workermill'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check for new models
        id: monitor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx scripts/model-monitor.ts --dry-run
          else
            npx tsx scripts/model-monitor.ts
          fi

      - name: Create PR if changes detected
        if: steps.monitor.outputs.has_changes == 'true' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto/model-update-$(date +%Y%m%d)"

          # Skip if a PR already exists for today's branch
          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "PR already exists for $BRANCH, skipping."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add api/src/providers/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(providers): add newly detected AI models

          Auto-detected by model-monitor workflow.
          New models: ${{ steps.monitor.outputs.new_models }}

          Pricing is ESTIMATED based on model family patterns.
          Please verify pricing against provider documentation before merging."

          git push origin "$BRANCH"

          # Write PR body to a temp file to avoid shell escaping issues
          cat > /tmp/pr-body.md <<'BODY'
          ## Auto-Detected Model Updates

          The daily model monitor detected new models from AI providers.

          **New models:** ${{ steps.monitor.outputs.new_models }}

          **Updated files:** ${{ steps.monitor.outputs.updated_files }}

          ### Action Required

          Pricing is **estimated** based on model family patterns (e.g., a new `gpt-X-mini` uses mini-tier pricing). Before merging:

          1. Check each provider's pricing page for actual rates
          2. Verify context window sizes
          3. Confirm streaming/caching support

          **Pricing pages:**
          - [OpenAI Pricing](https://platform.openai.com/docs/pricing)
          - [Google Gemini Pricing](https://ai.google.dev/gemini-api/docs/pricing)
          - [Anthropic Pricing](https://docs.anthropic.com/en/docs/about-claude/pricing)

          **Note:** Only the pricing engine files need updating. The provider registry reads from these dynamically.

          ---
          Generated by model-monitor workflow
          BODY

          gh pr create \
            --title "feat(providers): new AI models detected ($(date +%Y-%m-%d))" \
            --body-file /tmp/pr-body.md
