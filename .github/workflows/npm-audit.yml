name: npm audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: Audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: api
            install_args: ""
          - dir: frontend
            install_args: ""
          - dir: cli
            install_args: "--legacy-peer-deps"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install and audit
        working-directory: ${{ matrix.dir }}
        run: |
          npm ci --ignore-scripts ${{ matrix.install_args }}
          npm audit --omit=dev --audit-level=high
