name: Unpublish old VS Code extension versions

on:
  workflow_dispatch:

jobs:
  cleanup:
    if: github.repository == 'jarod-rosenthal/workermill'
    runs-on: ubuntu-latest
    steps:
      - name: Unpublish old versions (keep 0.2.22)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npm install -g @vscode/vsce
          for v in 0.2.21 0.2.20 0.2.19 0.2.18 0.2.16 0.2.15 0.2.14 0.2.13 0.2.12 0.2.11 0.2.10 0.2.9 0.2.7 0.2.6 0.2.5 0.2.4 0.2.3 0.2.2 0.2.1; do
            echo "Unpublishing $v..."
            npx @vscode/vsce unpublish workermill.workermill --version "$v" -p "$VSCE_PAT" || echo "Failed to unpublish $v"
          done
          echo "Done. Only 0.2.22 should remain."
