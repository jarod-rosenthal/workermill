name: VS Code Extension Release

on:
  push:
    tags:
      - 'vscode-v*'

jobs:
  publish:
    if: github.repository == 'jarod-rosenthal/workermill'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd packages/vscode-workermill && npm ci --ignore-scripts

      - name: Build extension
        run: cd packages/vscode-workermill && npm run build

      - name: Package VSIX
        run: cd packages/vscode-workermill && npx @vscode/vsce package --no-dependencies --allow-package-secrets github

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: cd packages/vscode-workermill && npx @vscode/vsce publish --no-dependencies --allow-package-secrets github -p $VSCE_PAT

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: cd packages/vscode-workermill && npx ovsx publish workermill-*.vsix -p $OVSX_PAT

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/vscode-workermill/workermill-*.vsix
          generate_release_notes: true
