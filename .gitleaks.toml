# Gitleaks configuration for WorkerMill
# Suppresses known false positives — template variables in docs and example code

title = "WorkerMill Gitleaks Config"

[allowlist]
  description = "Known false positives"

  # Template curl commands in docs, migrations, and worker scripts
  # These contain ${VARIABLE} patterns, not actual secrets
  paths = [
    '''api/docs/''',
    '''docs/''',
  ]

  regexTarget = "match"
  regexes = [
    # Environment variable references in curl auth patterns
    '''\$\{[A-Z_]+\}''',
    # Placeholder tokens in example/seed data
    '''Bearer \$\{''',
    '''Bearer \<''',
  ]
