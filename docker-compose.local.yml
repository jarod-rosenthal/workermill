version: '3.8'

# Local development Docker Compose for WorkerMill
# Usage: docker compose -f docker-compose.local.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: workermill-local-db
    environment:
      POSTGRES_USER: workermill
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: workermill
    ports:
      - "5432:5432"
    volumes:
      - workermill-local-data:/var/lib/postgresql/data
      - ./data/dumps:/dumps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workermill"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: workermill-local-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  workermill-local-data:
    name: workermill-local-data
