version: '3.8'

# Local development Docker Compose for WorkerMill
# Usage: docker compose -f docker-compose.local.yml up -d

services:
  postgres:
    image: postgres:15
    container_name: workermill-local-db
    environment:
      POSTGRES_USER: workermill
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: workermill
    ports:
      - "5432:5432"
    volumes:
      - workermill-local-data:/var/lib/postgresql/data
      - ./data/dumps:/dumps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workermill"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  workermill-local-data:
    name: workermill-local-data
