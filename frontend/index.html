<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="***REMOVED***0a0a0f" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>WorkerMill - AI Workers Control Center</title>
    <script>
      // Set theme IMMEDIATELY and block transitions to prevent flash
      // This runs before any CSS loads
      (function() {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');

        // Set theme class immediately
        document.documentElement.classList.add(theme);

        // Block all transitions until page is ready
        document.documentElement.style.setProperty('--theme-transition', 'none');

        // Update meta theme-color
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', theme === 'dark' ? '***REMOVED***0a0a0f' : '***REMOVED***e2e6ec');
        }

        // Re-enable transitions after a brief delay (after CSS loads)
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            document.documentElement.style.removeProperty('--theme-transition');
          }, 50);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
